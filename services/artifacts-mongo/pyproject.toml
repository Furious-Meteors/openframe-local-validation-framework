[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artifacts-mongo"
version = "0.1.0"
description = "openframe-local-validation: MongoDB adapter service"
requires-python = ">=3.11"
dependencies = [
    "openframe-adapters-db-mongo>=1.1,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
