[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-pipeline"
version = "0.1.0"
description = "openframe-local-validation: MongoDB + Redis + Kafka multi-adapter (Stage 2)"
requires-python = ">=3.11"
dependencies = [
    "openframe-adapters-db-mongo>=2.0,<3",
    "openframe-adapters-db-redis>=2.0,<3",
    "openframe-adapters-queue-kafka>=1.4,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "openframe-core[dev]>=3.0,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
