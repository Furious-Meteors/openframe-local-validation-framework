[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swap-demo"
version = "0.2.0"
description = "openframe-local-validation: adapter-swap demo — same service, same port, two backends (Stage 1)"
requires-python = ">=3.11"
dependencies = [
    "openframe-adapters-db-postgres>=1.2,<2",
    "openframe-adapters-db-mongo>=1.2,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "openframe-core[dev]>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
