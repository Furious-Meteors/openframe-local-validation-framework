[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "items-cached"
version = "0.1.0"
description = "openframe-local-validation: Postgres + Redis multi-adapter service (Stage 2)"
requires-python = ">=3.11"
dependencies = [
    "openframe-adapters-db-postgres>=1.2,<2",
    "openframe-adapters-db-redis>=1.1,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "openframe-core[dev]>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
