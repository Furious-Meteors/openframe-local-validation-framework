services:

  postgres:
    image: postgres:16-alpine
    container_name: openframe-postgres
    environment:
      POSTGRES_USER:     openframe
      POSTGRES_PASSWORD: openframe
      POSTGRES_DB:       openframe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openframe"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: openframe-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: openframe
      MONGO_INITDB_ROOT_PASSWORD: openframe
      MONGO_INITDB_DATABASE:      openframe
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: openframe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: openframe-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT — host access (localhost:9092); INTERNAL — Docker-internal access (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL",
             "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── research-pipeline (Stage 2 + Stage 8) ────────────────────────────────
  # Three-adapter service: MongoDB (persistence) + Redis (cache) + Kafka (queue).
  # OTEL_EXPORTER_OTLP_ENDPOINT points to localhost:4318 which resolves to the
  # research-pipeline-collector sidecar sharing this container's network namespace.
  research-pipeline:
    build:
      context: ../services/research-pipeline
      dockerfile: Dockerfile
    container_name: openframe-research-pipeline
    environment:
      MONGO_URL:                    mongodb://openframe:openframe@mongo:27017
      MONGO_DATABASE:               openframe
      REDIS_URL:                    redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS:      kafka:29092
      KAFKA_TOPIC:                  artifact-events
      # Resolved to the sidecar via shared network namespace — not a separate hop.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_SERVICE_NAME:            research-pipeline
    ports:
      - "8007:8007"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8007/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── research-pipeline-collector (Stage 8 sidecar) ────────────────────────
  # Shares research-pipeline's network namespace so localhost:4318 inside
  # research-pipeline resolves directly to this collector — no extra network hop.
  #
  # Cold-start note: the collector starts AFTER research-pipeline (network_mode
  # requires the target container to exist first). A handful of spans produced
  # during those first seconds are dropped by the SDK's bounded queue and never
  # retried. This is expected and acceptable — the design is "bounded loss, never
  # blocking". research-pipeline keeps serving traffic regardless.
  research-pipeline-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: openframe-research-pipeline-collector
    network_mode: "service:research-pipeline"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ../services/research-pipeline/collector-config.yaml:/etc/otel/collector-config.yaml:ro
      - research_pipeline_otel_data:/var/otel
    depends_on:
      - research-pipeline

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  # Persistent volume for the research-pipeline sidecar collector.
  # Holds both the file_storage extension queue directory and the
  # file exporter output (spans.jsonl). Survives collector restarts.
  research_pipeline_otel_data:
