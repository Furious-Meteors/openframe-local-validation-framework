services:

  # ── Infrastructure backends ───────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: openframe-postgres
    environment:
      POSTGRES_USER:     openframe
      POSTGRES_PASSWORD: openframe
      POSTGRES_DB:       openframe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openframe"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: openframe-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: openframe
      MONGO_INITDB_ROOT_PASSWORD: openframe
      MONGO_INITDB_DATABASE:      openframe
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: openframe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: openframe-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT — host access (localhost:9092); INTERNAL — Docker-internal access (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL",
             "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── Stage 1 services + sidecars ───────────────────────────────────────────
  #
  # Sidecar pattern: each collector uses network_mode: "service:<app>" so that
  # localhost:4318 inside the app resolves directly to the collector — no
  # separate network hop, no shared gateway.
  #
  # Cold-start note: network_mode: "service:X" requires X to exist first, so
  # the collector always starts after the app. Early spans dropped by the SDK's
  # bounded queue are expected and acceptable (bounded loss, never blocking).

  # ── items-postgres (port 8001) ─────────────────────────────────────────────

  items-postgres:
    build:
      context: ../services/items-postgres
      dockerfile: Dockerfile
    container_name: openframe-items-postgres
    environment:
      DATABASE_URL:                 postgresql://openframe:openframe@postgres:5432/openframe
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_SERVICE_NAME:            items-postgres
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  items-postgres-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: openframe-items-postgres-collector
    user: "0"
    network_mode: "service:items-postgres"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
      - items_postgres_otel_data:/var/otel
    depends_on:
      - items-postgres

  # ── artifacts-mongo (port 8002) ────────────────────────────────────────────

  artifacts-mongo:
    build:
      context: ../services/artifacts-mongo
      dockerfile: Dockerfile
    container_name: openframe-artifacts-mongo
    environment:
      MONGO_URL:                    mongodb://openframe:openframe@mongo:27017
      MONGO_DATABASE:               openframe
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_SERVICE_NAME:            artifacts-mongo
    ports:
      - "8002:8002"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  artifacts-mongo-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: openframe-artifacts-mongo-collector
    user: "0"
    network_mode: "service:artifacts-mongo"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
      - artifacts_mongo_otel_data:/var/otel
    depends_on:
      - artifacts-mongo

  # ── cache-redis (port 8003) ────────────────────────────────────────────────

  cache-redis:
    build:
      context: ../services/cache-redis
      dockerfile: Dockerfile
    container_name: openframe-cache-redis
    environment:
      REDIS_URL:                    redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_SERVICE_NAME:            cache-redis
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cache-redis-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: openframe-cache-redis-collector
    user: "0"
    network_mode: "service:cache-redis"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
      - cache_redis_otel_data:/var/otel
    depends_on:
      - cache-redis

  # ── events-kafka (port 8004) ───────────────────────────────────────────────

  events-kafka:
    build:
      context: ../services/events-kafka
      dockerfile: Dockerfile
    container_name: openframe-events-kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS:      kafka:29092
      KAFKA_TOPIC:                  order-events
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_SERVICE_NAME:            events-kafka
    ports:
      - "8004:8004"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  events-kafka-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: openframe-events-kafka-collector
    user: "0"
    network_mode: "service:events-kafka"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
      - events_kafka_otel_data:/var/otel
    depends_on:
      - events-kafka

  # ── swap-demo (port 8005) ──────────────────────────────────────────────────
  # Default backend: postgres. Override with PERSISTENCE_BACKEND=mongo to prove
  # the adapter swap — same spans, same service.name, different adapter code path.

  swap-demo:
    build:
      context: ../services/swap-demo
      dockerfile: Dockerfile
    container_name: openframe-swap-demo
    environment:
      PERSISTENCE_BACKEND:          postgres
      DATABASE_URL:                 postgresql://openframe:openframe@postgres:5432/openframe
      MONGO_URL:                    mongodb://openframe:openframe@mongo:27017
      MONGO_DATABASE:               openframe
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_SERVICE_NAME:            swap-demo
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  swap-demo-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: openframe-swap-demo-collector
    user: "0"
    network_mode: "service:swap-demo"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
      - swap_demo_otel_data:/var/otel
    depends_on:
      - swap-demo

  # ── Stage 2 services + sidecars ───────────────────────────────────────────

  # ── items-cached (port 8006) ───────────────────────────────────────────────

  items-cached:
    build:
      context: ../services/items-cached
      dockerfile: Dockerfile
    container_name: openframe-items-cached
    environment:
      DATABASE_URL:                 postgresql://openframe:openframe@postgres:5432/openframe
      REDIS_URL:                    redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_SERVICE_NAME:            items-cached
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  items-cached-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: openframe-items-cached-collector
    user: "0"
    network_mode: "service:items-cached"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
      - items_cached_otel_data:/var/otel
    depends_on:
      - items-cached

  # ── research-pipeline (port 8007) ─────────────────────────────────────────
  # Three-adapter service: MongoDB (persistence) + Redis (cache) + Kafka (queue).

  research-pipeline:
    build:
      context: ../services/research-pipeline
      dockerfile: Dockerfile
    container_name: openframe-research-pipeline
    environment:
      MONGO_URL:                    mongodb://openframe:openframe@mongo:27017
      MONGO_DATABASE:               openframe
      REDIS_URL:                    redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS:      kafka:29092
      KAFKA_TOPIC:                  artifact-events
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      OTEL_SERVICE_NAME:            research-pipeline
    ports:
      - "8007:8007"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8007/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  research-pipeline-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: openframe-research-pipeline-collector
    user: "0"
    network_mode: "service:research-pipeline"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      # Shared config — identical to all other sidecars.
      # services/research-pipeline/collector-config.yaml is kept as a
      # per-service reference copy but this canonical shared version is used.
      - ./collector-config.yaml:/etc/otel/collector-config.yaml:ro
      - research_pipeline_otel_data:/var/otel
    depends_on:
      - research-pipeline

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  # One isolated OTel data volume per sidecar.
  # Each holds the file_storage queue directory and the spans.jsonl output.
  items_postgres_otel_data:
  artifacts_mongo_otel_data:
  cache_redis_otel_data:
  events_kafka_otel_data:
  swap_demo_otel_data:
  items_cached_otel_data:
  research_pipeline_otel_data:
